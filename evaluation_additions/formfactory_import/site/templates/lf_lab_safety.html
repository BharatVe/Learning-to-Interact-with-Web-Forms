{% extends 'base.html' %}
{% block title %}Lab Safety Training Registration{% endblock %}
{% block content %}
<div class="card shadow">
  <div class="card-body">
    <h1 class="mb-2">Lab Safety Training Registration</h1>
    <p class="text-muted">Registration form for laboratory safety training and access preparation.</p>
    <form method="POST" id="lab_safetyForm">
      <div role="list">
  <div class="mb-3" role="listitem" data-question-order="1">
    <label class="form-label" for="lab_safety_1_full_name">Full name <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="lab_safety_1_full_name" name="lab_safety_1_full_name" required aria-required="true">
  </div>
  <div class="mb-3" role="listitem" data-question-order="2">
    <label class="form-label" for="lab_safety_2_university_email">University email <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="lab_safety_2_university_email" name="lab_safety_2_university_email" required aria-required="true">
  </div>
  <div class="mb-3" role="listitem" data-question-order="3">
    <label class="form-label" for="lab_safety_3_role">Role <span class="text-danger">*</span></label>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_3_role" id="lab_safety_3_role_0" value="Bachelor&#x27;s student" aria-label="Bachelor&#x27;s student" required aria-required="true">
      <label class="form-check-label" for="lab_safety_3_role_0">Bachelor&#x27;s student</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_3_role" id="lab_safety_3_role_1" value="Master&#x27;s student" aria-label="Master&#x27;s student" required aria-required="true">
      <label class="form-check-label" for="lab_safety_3_role_1">Master&#x27;s student</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_3_role" id="lab_safety_3_role_2" value="PhD student" aria-label="PhD student" required aria-required="true">
      <label class="form-check-label" for="lab_safety_3_role_2">PhD student</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_3_role" id="lab_safety_3_role_3" value="Research staff" aria-label="Research staff" required aria-required="true">
      <label class="form-check-label" for="lab_safety_3_role_3">Research staff</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_3_role" id="lab_safety_3_role_4" value="Visitor" aria-label="Visitor" required aria-required="true">
      <label class="form-check-label" for="lab_safety_3_role_4">Visitor</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="4">
    <label class="form-label" for="lab_safety_4_lab_area_you_need_access_to">Lab area you need access to <span class="text-danger">*</span></label>
    <select class="form-select" id="lab_safety_4_lab_area_you_need_access_to" name="lab_safety_4_lab_area_you_need_access_to" required aria-required="true">
      <option value="" disabled selected>Select an option</option>
      <option value="Wet lab">Wet lab</option>
      <option value="Electronics lab">Electronics lab</option>
      <option value="Robotics lab">Robotics lab</option>
      <option value="Computer lab">Computer lab</option>
      <option value="Workshop">Workshop</option>
    </select>
  </div>
  <div class="mb-3" role="listitem" data-question-order="5">
    <label class="form-label" for="lab_safety_5_previous_safety_training_completed">Previous safety training completed <span class="text-danger">*</span></label>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_5_previous_safety_training_completed" id="lab_safety_5_previous_safety_training_completed_0" value="Yes" aria-label="Yes" required aria-required="true">
      <label class="form-check-label" for="lab_safety_5_previous_safety_training_completed_0">Yes</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_5_previous_safety_training_completed" id="lab_safety_5_previous_safety_training_completed_1" value="No" aria-label="No" required aria-required="true">
      <label class="form-check-label" for="lab_safety_5_previous_safety_training_completed_1">No</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="lab_safety_5_previous_safety_training_completed" id="lab_safety_5_previous_safety_training_completed_2" value="Not sure" aria-label="Not sure" required aria-required="true">
      <label class="form-check-label" for="lab_safety_5_previous_safety_training_completed_2">Not sure</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="6">
    <label class="form-label" for="lab_safety_6_training_topics_needed">Training topics needed</label>
    <div class="form-text">Select one or more.</div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="lab_safety_6_training_topics_needed" id="lab_safety_6_training_topics_needed_0" value="General safety" aria-label="General safety">
      <label class="form-check-label" for="lab_safety_6_training_topics_needed_0">General safety</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="lab_safety_6_training_topics_needed" id="lab_safety_6_training_topics_needed_1" value="Chemical handling" aria-label="Chemical handling">
      <label class="form-check-label" for="lab_safety_6_training_topics_needed_1">Chemical handling</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="lab_safety_6_training_topics_needed" id="lab_safety_6_training_topics_needed_2" value="Electrical safety" aria-label="Electrical safety">
      <label class="form-check-label" for="lab_safety_6_training_topics_needed_2">Electrical safety</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="lab_safety_6_training_topics_needed" id="lab_safety_6_training_topics_needed_3" value="Machine safety" aria-label="Machine safety">
      <label class="form-check-label" for="lab_safety_6_training_topics_needed_3">Machine safety</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="lab_safety_6_training_topics_needed" id="lab_safety_6_training_topics_needed_4" value="Emergency procedures" aria-label="Emergency procedures">
      <label class="form-check-label" for="lab_safety_6_training_topics_needed_4">Emergency procedures</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="7">
    <label class="form-label" for="lab_safety_7_preferred_training_date">Preferred training date</label>
    <div class="form-text">Format: YYYY-MM-DD</div>
    <input type="text" class="form-control" id="lab_safety_7_preferred_training_date" name="lab_safety_7_preferred_training_date" placeholder="YYYY-MM-DD">
  </div>
  <div class="mb-3" role="listitem" data-question-order="8">
    <label class="form-label" for="lab_safety_8_questions_for_the_trainer">Questions for the trainer</label>
    <textarea class="form-control" id="lab_safety_8_questions_for_the_trainer" name="lab_safety_8_questions_for_the_trainer" rows="4"></textarea>
  </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
