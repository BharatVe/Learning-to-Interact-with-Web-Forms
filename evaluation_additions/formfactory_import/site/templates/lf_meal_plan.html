{% extends 'base.html' %}
{% block title %}Meal Preference Poll{% endblock %}
{% block content %}
<div class="card shadow">
  <div class="card-body">
    <h1 class="mb-2">Meal Preference Poll</h1>
    <p class="text-muted">Collects meal choices, allergies, and preferred dining time.</p>
    <form method="POST" id="meal_planForm">
      <div role="list">
  <div class="mb-3" role="listitem" data-question-order="1">
    <label class="form-label" for="meal_plan_1_full_name">Full name <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="meal_plan_1_full_name" name="meal_plan_1_full_name" required aria-required="true">
  </div>
  <div class="mb-3" role="listitem" data-question-order="2">
    <label class="form-label" for="meal_plan_2_meal_preference">Meal preference <span class="text-danger">*</span></label>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_2_meal_preference" id="meal_plan_2_meal_preference_0" value="Vegetarian" aria-label="Vegetarian" required aria-required="true">
      <label class="form-check-label" for="meal_plan_2_meal_preference_0">Vegetarian</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_2_meal_preference" id="meal_plan_2_meal_preference_1" value="Vegan" aria-label="Vegan" required aria-required="true">
      <label class="form-check-label" for="meal_plan_2_meal_preference_1">Vegan</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_2_meal_preference" id="meal_plan_2_meal_preference_2" value="Chicken" aria-label="Chicken" required aria-required="true">
      <label class="form-check-label" for="meal_plan_2_meal_preference_2">Chicken</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_2_meal_preference" id="meal_plan_2_meal_preference_3" value="Fish" aria-label="Fish" required aria-required="true">
      <label class="form-check-label" for="meal_plan_2_meal_preference_3">Fish</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_2_meal_preference" id="meal_plan_2_meal_preference_4" value="Beef" aria-label="Beef" required aria-required="true">
      <label class="form-check-label" for="meal_plan_2_meal_preference_4">Beef</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="3">
    <label class="form-label" for="meal_plan_3_allergies_or_intolerances">Allergies or intolerances</label>
    <div class="form-text">Select all that apply.</div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_0" value="Gluten" aria-label="Gluten">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_0">Gluten</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_1" value="Nuts" aria-label="Nuts">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_1">Nuts</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_2" value="Dairy" aria-label="Dairy">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_2">Dairy</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_3" value="Soy" aria-label="Soy">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_3">Soy</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_4" value="None" aria-label="None">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_4">None</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" role="checkbox" name="meal_plan_3_allergies_or_intolerances" id="meal_plan_3_allergies_or_intolerances_5" value="Other" aria-label="Other">
      <label class="form-check-label" for="meal_plan_3_allergies_or_intolerances_5">Other</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="4">
    <label class="form-label" for="meal_plan_4_preferred_dining_date">Preferred dining date</label>
    <div class="form-text">Format: YYYY-MM-DD</div>
    <input type="text" class="form-control" id="meal_plan_4_preferred_dining_date" name="meal_plan_4_preferred_dining_date" placeholder="YYYY-MM-DD">
  </div>
  <div class="mb-3" role="listitem" data-question-order="5">
    <label class="form-label" for="meal_plan_5_preferred_dining_time">Preferred dining time</label>
    <div class="form-text">Format: HH:MM (24-hour)</div>
    <input type="text" class="form-control" id="meal_plan_5_preferred_dining_time" name="meal_plan_5_preferred_dining_time" placeholder="HH:MM">
  </div>
  <div class="mb-3" role="listitem" data-question-order="6">
    <label class="form-label" for="meal_plan_6_would_you_like_dessert">Would you like dessert? <span class="text-danger">*</span></label>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_6_would_you_like_dessert" id="meal_plan_6_would_you_like_dessert_0" value="Yes" aria-label="Yes" required aria-required="true">
      <label class="form-check-label" for="meal_plan_6_would_you_like_dessert_0">Yes</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_6_would_you_like_dessert" id="meal_plan_6_would_you_like_dessert_1" value="No" aria-label="No" required aria-required="true">
      <label class="form-check-label" for="meal_plan_6_would_you_like_dessert_1">No</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" role="radio" name="meal_plan_6_would_you_like_dessert" id="meal_plan_6_would_you_like_dessert_2" value="Maybe" aria-label="Maybe" required aria-required="true">
      <label class="form-check-label" for="meal_plan_6_would_you_like_dessert_2">Maybe</label>
    </div>
  </div>
  <div class="mb-3" role="listitem" data-question-order="7">
    <label class="form-label" for="meal_plan_7_additional_notes">Additional notes</label>
    <textarea class="form-control" id="meal_plan_7_additional_notes" name="meal_plan_7_additional_notes" rows="4"></textarea>
  </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
